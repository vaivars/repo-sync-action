name: 'Repo Sync Action'
description: 'Keep files and directories in sync across GitHub repositories.'
author: 'Vaivars'

inputs:
  GH_PAT:
    description: |
      Personal access token (classic or fine-grained) with access to the target repositories. Required unless GH_INSTALLATION_TOKEN is set
    required: false
  GH_INSTALLATION_TOKEN:
    description: |
      GitHub App installation token with access to the target repositories. Used when GH_PAT is not set
    required: false
  CONFIG_PATH:
    description: |
      Path to the sync configuration file. Defaults to .github/sync.yml
    required: false
  IS_FINE_GRAINED:
    description: |
      Set to true when GH_PAT is a fine-grained token. Defaults to false
    required: false
  PR_LABELS:
    description: |
      Labels to add to the pull request, one per line. Set to false to add none. Defaults to sync
    required: false
  PR_BODY:
    description: |
      Extra text for the pull request description. Defaults to none
    required: false
  ASSIGNEES:
    description: |
      Users to assign to the pull request, one per line. Defaults to none
    required: false
  REVIEWERS:
    description: |
      Users to request a review from, one per line. Defaults to none
    required: false
  TEAM_REVIEWERS:
    description: |
      Teams to request a review from, one per line. Defaults to none
    required: false
  COMMIT_PREFIX:
    description: |
      Prefix for commit messages and the pull request title. Defaults to 🔄
    required: false
  COMMIT_BODY:
    description: |
      Text appended to every commit message after a blank line. Defaults to none
    required: false
  COMMIT_EACH_FILE:
    description: |
      Create one commit per file entry instead of one commit for everything. Defaults to true
    required: false
  GIT_EMAIL:
    description: |
      Commit author email. Defaults to the email of the GH_PAT owner
    required: false
  GIT_USERNAME:
    description: |
      Commit author name. Defaults to the login of the GH_PAT owner
    required: false
  TMP_DIR:
    description: |
      Working directory for the clones. Defaults to tmp-<timestamp>
    required: false
  DRY_RUN:
    description: |
      Do everything except push and open pull requests. Defaults to false
    required: false
  SKIP_CLEANUP:
    description: |
      Keep TMP_DIR after the run (useful for debugging). Defaults to false
    required: false
  OVERWRITE_EXISTING_PR:
    description: |
      Update an open sync pull request instead of opening a new one. Defaults to true
    required: false
  ORIGINAL_MESSAGE:
    description: |
      When a push of a single commit triggers the run, reuse its message for commits and its body as the pull request description. Defaults to false
    required: false
  COMMIT_AS_PR_TITLE:
    description: |
      With ORIGINAL_MESSAGE, use the first line of that message as the pull request title. Defaults to false
    required: false
  SKIP_PR:
    description: |
      Commit straight to the target branch without a pull request. Defaults to false
    required: false
  BRANCH_PREFIX:
    description: |
      Prefix for the pull request branch. SOURCE_REPO_NAME is replaced with the source repository name. Defaults to repo-sync/SOURCE_REPO_NAME
    required: false
  FORK:
    description: |
      Account whose fork the changes are pushed to before opening the pull request. The token must belong to this account. Defaults to none
    required: false

outputs:
  pull_request_urls:
    description: 'JSON array of the URLs of pull requests created or updated in this run'

runs:
  using: 'node24'
  main: 'dist/index.js'

branding:
  icon: 'git-pull-request'
  color: 'gray-dark'
