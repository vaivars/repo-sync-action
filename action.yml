name: 'Repo Sync Action'
description: 'Keep files and directories in sync across GitHub repositories.'
author: 'Vaivars'

inputs:
  GH_PAT:
    description: |
      Personal access token (classic or fine-grained) with access to the target repositories. Required unless GH_INSTALLATION_TOKEN is set
    required: false
  GH_INSTALLATION_TOKEN:
    description: |
      GitHub App installation token with access to the target repositories. Used when GH_PAT is not set
    required: false
  CONFIG_PATH:
    description: |
      Path to the sync configuration file
    required: false
    default: '.github/sync.yml'
  IS_FINE_GRAINED:
    description: |
      Set to true when GH_PAT is a fine-grained token
    required: false
    default: 'false'
  PR_LABELS:
    description: |
      Labels to add to the pull request, one per line. Set to false to add none
    required: false
    default: 'sync'
  PR_BODY:
    description: |
      Extra text for the pull request description
    required: false
  ASSIGNEES:
    description: |
      Users to assign to the pull request, one per line
    required: false
  REVIEWERS:
    description: |
      Users to request a review from, one per line
    required: false
  TEAM_REVIEWERS:
    description: |
      Teams to request a review from, one per line
    required: false
  PR_AUTOMERGE:
    description: |
      Enable auto-merge on the pull request, so GitHub merges it once its required checks and reviews pass. A pull request with none to wait for is merged right away. Not applied with FORK
    required: false
    default: 'false'
  PR_AUTOMERGE_METHOD:
    description: |
      How PR_AUTOMERGE merges the pull request: merge, squash or rebase
    required: false
    default: 'merge'
  COMMIT_PREFIX:
    description: |
      Prefix for commit messages and the pull request title
    required: false
    default: '🔄'
  COMMIT_BODY:
    description: |
      Text appended to every commit message after a blank line
    required: false
  COMMIT_EACH_FILE:
    description: |
      Create one commit per file entry instead of one commit for everything
    required: false
    default: 'true'
  GIT_EMAIL:
    description: |
      Commit author email. Defaults to the email of the GH_PAT owner
    required: false
  GIT_USERNAME:
    description: |
      Commit author name. Defaults to the login of the GH_PAT owner
    required: false
  TMP_DIR:
    description: |
      Working directory for the clones. Files in it are never synced or read by templates. Defaults to $RUNNER_TEMP/repo-sync-<timestamp>
    required: false
  DRY_RUN:
    description: |
      Do everything except push and open pull requests
    required: false
    default: 'false'
  SKIP_CLEANUP:
    description: |
      Keep TMP_DIR after the run (useful for debugging)
    required: false
    default: 'false'
  OVERWRITE_EXISTING_PR:
    description: |
      Update an open sync pull request instead of opening a new one
    required: false
    default: 'true'
  ORIGINAL_MESSAGE:
    description: |
      When a push of a single commit triggers the run, reuse its message for commits and its body as the pull request description
    required: false
    default: 'false'
  COMMIT_AS_PR_TITLE:
    description: |
      With ORIGINAL_MESSAGE, use the first line of that message as the pull request title
    required: false
    default: 'false'
  SKIP_PR:
    description: |
      Commit straight to the target branch without a pull request. Can't be used together with FORK
    required: false
    default: 'false'
  BRANCH_PREFIX:
    description: |
      Prefix for the pull request branch. SOURCE_REPO_NAME is replaced with the source repository name
    required: false
    default: 'repo-sync/SOURCE_REPO_NAME'
  FORK:
    description: |
      Account whose fork the changes are pushed to before opening the pull request. The token must belong to this account. Can't be used together with SKIP_PR
    required: false

outputs:
  pull_request_urls:
    description: 'JSON array of the URLs of pull requests created or updated in this run'

runs:
  using: 'node24'
  main: 'dist/index.js'

branding:
  icon: 'git-pull-request'
  color: 'gray-dark'
