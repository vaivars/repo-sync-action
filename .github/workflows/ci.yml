name: Lint/Build/Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      - run: mise run test-ci

      # Separate step so only the workflow linters see the token, which zizmor uses for its online audits
      - name: Lint workflows
        run: mise run lint:actions
        env:
          GH_TOKEN: ${{ github.token }}
