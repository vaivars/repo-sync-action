name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
      - run: npm ci
      - run: mise run format:check
      - run: mise run lint
      - name: Typecheck
        run: mise run typecheck
      # Only this step gets the token, which zizmor uses for its online audits
      - name: Lint workflows
        run: mise run lint:actions
        env:
          GH_TOKEN: ${{ github.token }}

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
      - run: npm ci
      - run: mise run test

  check-dist:
    name: Check dist
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
      - run: npm ci
      # The action runs the committed dist/, so it has to match a fresh build of src/
      - id: build
        run: npm run build:check
      - name: Upload the expected dist
        if: failure() && steps.build.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  dry-run:
    name: Dry run
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Runs this commit's dist/ the way users do, syncing .github/e2e/ into a clone of this repository.
      # actionlint doesn't support the $/ self-repository syntax yet
      - uses: ./ # zizmor: ignore[self-repository]
        with:
          GH_INSTALLATION_TOKEN: ${{ github.token }}
          CONFIG_PATH: .github/e2e/sync.yml
          TMP_DIR: ${{ runner.temp }}/repo-sync
          DRY_RUN: true
          SKIP_CLEANUP: true
      - name: Check the synced clone
        run: |
          clone="$RUNNER_TEMP/repo-sync/github.com/vaivars/repo-sync-action@main"
          test "$(cat "$clone/e2e/hello.txt")" = 'Hello e2e'
          test "$(cat "$clone/e2e/nested/list.txt")" = 'a,b'
          test ! -e "$clone/e2e/skip.txt"
          git -C "$clone" log -1 --format=%s | grep -F "'e2e/'"
          if grep -Eqi 'authorization|x-access-token' "$clone/.git/config"; then
            echo '::error::The clone stores credentials in .git/config'
            exit 1
          fi
