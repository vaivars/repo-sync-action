[tools]
node = "24"
dprint = "0.64.3"
actionlint = "1.7.12"
shellcheck = "0.11.0"
zizmor = "1.31.1"
git-cliff = "2.14.2"

[tasks.install]
description = "Install the dependencies from the lockfile"
run = "npm ci"

[tasks.lint]
run = "npm run lint"

[tasks.build]
run = "npm run build"

[tasks.format]
run = "dprint fmt"

[tasks."format:check"]
run = "dprint check"

[tasks."lint:actions"]
description = "Lint the GitHub Actions workflows. zizmor adds its online audits when GH_TOKEN is set"
run = [
    "actionlint",
    "zizmor .github/workflows",
]

[tasks.test]
depends = ["build"]
description = "Run the unit tests and the local integration test with mocked git"
run = [
    "node --test 'tests/*.test.js'",
]

[tasks.ci]
description = "Run every check CI runs, except the dry run of the action itself"
run = [
    "mise run install",
    "mise run format:check",
    "mise run lint",
    "mise run lint:actions",
    "mise run test",
    "npm run build:check",
]
