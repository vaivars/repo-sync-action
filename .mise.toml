[tools]
node = "24"
dprint = "0.64.3"
actionlint = "1.7.12"
shellcheck = "0.11.0"
zizmor = "1.31.1"

[tasks.install]
run = "npm install --save-dev"

[tasks.lint]
run = "npm run lint"

[tasks.build]
run = "npm run build"

[tasks.format]
run = "dprint fmt"

[tasks."format:check"]
run = "dprint check"

[tasks."lint:actions"]
description = "Lint the GitHub Actions workflows. zizmor adds its online audits when GH_TOKEN is set"
run = [
    "actionlint",
    "zizmor .github/workflows",
]

[tasks.test]
depends = ["build"]
description = "Run the unit tests and the local integration test with mocked git"
run = [
    "node --test tests/helpers.test.js",
    "node tests/local-sync.test.js",
]

[tasks.test-ci]
hide = true
description = "CI task for running lint/build/test and checking that the committed dist/ is up to date"
run = [
    "mise run install",
    "mise run format:check",
    "mise run lint",
    "mise run test",
    "npm run build:check",
]
